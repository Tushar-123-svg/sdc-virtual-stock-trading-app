<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up — Paper &amp; Bell</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <h1>Paper &amp; Bell</h1>
        <p class="sub">Create your trading account — $100,000 in virtual cash to start.</p>

        <div id="errorBox" class="form-error" style="display:none;"></div>

        <form id="signupForm">
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="new-password" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;padding:10px 0;">Create account</button>
        </form>

        <div class="auth-switch">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
      const form = document.getElementById("signupForm");
      const errorBox = document.getElementById("errorBox");

      // If someone is already logged in, sitting on the signup page
      // makes no sense — send them straight to their module.
      const existing = getSession();
      if (existing) {
        window.location.href = existing.role === "admin" ? "admin/dashboard.html" : "user/market.html";
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const result = signup({ username, email, password });
        if (!result.ok) {
          errorBox.textContent = result.error;
          errorBox.style.display = "block";
          return;
        }

        // Auto-login right after signup, then route to the User module.
        login({ username, password });
        window.location.href = "user/market.html";
      });
    </script>
  </body>
</html>
